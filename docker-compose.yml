services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
      DB_NAME: ${DB_NAME}
    # Runs db/init.sql in the background once the server accepts connections; sqlservr stays PID 1
    entrypoint:
      - /bin/bash
      - -c
      - |
        (
          until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -v DB_NAME="$$DB_NAME" -i /db/init.sql > /dev/null 2>&1; do
            sleep 2
          done
        ) &
        exec /opt/mssql/bin/sqlservr
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./db:/db:ro
    # Connects to DB_NAME, so healthy means the database exists, not just that the server is up
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d \"$$DB_NAME\" -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "8080:8080"

  ui:
    build: ./ui
    depends_on:
      - app
    environment:
      API_URL: http://app:8080
    ports:
      - "3000:3000"

volumes:
  mssql_data:
